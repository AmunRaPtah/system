name: System
options:
  bundleIdPrefix: org.zyco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  System:
    type: application
    platform: iOS
    sources:
      - path: System
        excludes:
          - "Resources/Content"
          - "Resources/Content/**"
      # Folder reference: every JSON dropped into Content/ is bundled as
      # System.app/Content/<file>.json without regenerating the group tree.
      - path: System/Resources/Content
        type: folder
        buildPhase: resources
    dependencies:
      - target: SystemWidget
        embed: true
    entitlements:
      path: Support/System.entitlements
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: System
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSHealthShareUsageDescription: "System reads your steps, active energy, sleep and workouts (read-only, on this device) to auto-complete body quests and soften penalties after a short night."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zyco.system
        PRODUCT_NAME: System
        PRODUCT_MODULE_NAME: HunterSystem
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
  SystemWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SystemWidget
      - path: System/Shared/WidgetSnapshot.swift
    entitlements:
      path: Support/SystemWidget.entitlements
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: System
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zyco.system.widget
        PRODUCT_NAME: SystemWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
schemes:
  System:
    build:
      targets:
        System: all
    run:
      config: Debug
    archive:
      config: Release
