name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned (device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project System.xcodeproj \
            -scheme System \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E 'error:|warning: .*deprecated|\*\* BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"

      - name: Show compile errors
        if: failure()
        run: grep -E 'error:' "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -100 || true

      - name: Package .app into .ipa
        run: |
          cd "$RUNNER_TEMP"
          APP=$(find dd/Build/Products -maxdepth 2 -name 'System.app' -path '*Release-iphoneos*' | head -1)
          test -n "$APP" || { echo "No .app found"; find dd/Build/Products -name '*.app'; exit 1; }
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          # Widget must be embedded; ad-hoc sign both bundles with their
          # entitlements so SideStore/AltStore see HealthKit + the App Group
          # (an unsigned build carries no entitlements at all).
          SUP="$GITHUB_WORKSPACE/ios/Support"
          test -d Payload/System.app/PlugIns/SystemWidget.appex || { echo "SystemWidget.appex not embedded"; exit 1; }
          codesign --force --sign - --entitlements "$SUP/SystemWidget.entitlements" Payload/System.app/PlugIns/SystemWidget.appex
          codesign --force --sign - --entitlements "$SUP/System.entitlements" Payload/System.app
          codesign -d --entitlements - Payload/System.app 2>/dev/null | grep -E 'healthkit|application-groups' || true
          zip -qry System.ipa Payload
          unzip -l System.ipa | grep -E 'SystemWidget.appex/(SystemWidget|Info.plist)$'
          ls -lh System.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: System-ipa
          path: ${{ runner.temp }}/System.ipa
          if-no-files-found: error

      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned build of ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ)). Sideload with SideStore or AltStore."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/System.ipa" \
            --target "$GITHUB_SHA" \
            --title "System (latest)" \
            --notes "$NOTES" \
            --latest
