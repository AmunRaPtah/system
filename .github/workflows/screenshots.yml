name: Screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Generate Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(c[-1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project System.xcodeproj -scheme System -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | grep -E 'error:|\*\* BUILD' || true
          test -d "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/System.app"

      - name: Capture screens
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/System.app"
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          mkdir -p shots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BID" -demo "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 1-quests -tab 0
          shot 2-train -tab 1
          shot 3-mind -tab 2
          shot 4-stats -tab 3
          shot 5-shadows -tab 3 -screen shadows
          shot 6-arise -tab 0 -alert
          shot 7-breath -tab 2 -screen breath
          shot 8-support -tab 0 -screen support
          ls -l shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
